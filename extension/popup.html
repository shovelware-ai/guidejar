<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        font: 13px/1.4 system-ui, -apple-system, sans-serif;
        color: #0f172a;
      }
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 12px;
      }
      .dot {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        background: #4f46e5;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 11px;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 9px;
        font: 600 13px system-ui;
        cursor: pointer;
      }
      .primary {
        background: #4f46e5;
        color: #fff;
      }
      .danger {
        background: #ef4444;
        color: #fff;
      }
      .ghost {
        background: #f1f5f9;
        color: #0f172a;
        margin-top: 8px;
      }
      .status {
        margin: 10px 0;
        padding: 8px 10px;
        border-radius: 8px;
        background: #f8fafc;
        color: #475569;
      }
      .rec {
        color: #b91c1c;
        font-weight: 600;
      }
      label {
        display: block;
        margin-top: 14px;
        color: #64748b;
        font-size: 11px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 6px 8px;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        font: 12px system-ui;
      }
    </style>
  </head>
  <body>
    <div class="brand"><span class="dot">▶</span> Guidejar Capture</div>

    <div id="status" class="status">Loading…</div>

    <button id="toggle" class="primary">Start recording</button>
    <button id="download" class="ghost" hidden>Download last capture (.json)</button>

    <label for="appUrl">App URL</label>
    <input id="appUrl" type="text" placeholder="http://localhost:3000" />

    <script src="popup.js"></script>
  </body>
</html>
